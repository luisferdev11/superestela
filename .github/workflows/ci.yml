name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: CI reads the code and writes comments, nothing else.
permissions:
  contents: read
  pull-requests: write

# A new push supersedes the run in flight. Four people on one repo for four
# weeks cannot afford to queue behind stale runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The runner is pinned rather than left on ubuntu-latest: that label moves to
# Ubuntu 26 on 19 October, four days after the delivery. A build that changes
# underneath us is not reproducible, and the week of the deadline is the worst
# possible time to find out.
jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: mypy --strict
        run: uv run mypy packages/
      - name: pytest
        run: uv run pytest --cov=packages --cov-report=term-missing

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # packages/web/ arrives with the Next.js scaffold. Until then this job has
      # nothing to do, and a job with nothing to do must not fail the build.
      # The check lives in a step rather than in the job's `if`, because
      # hashFiles() needs a checked-out workspace and a job-level `if` runs
      # before there is one - which invalidates the whole workflow file.
      - id: scaffold
        run: |
          if [ -f packages/web/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "packages/web/ no existe todavia; nada que revisar." >> "$GITHUB_STEP_SUMMARY"
          fi

      - if: steps.scaffold.outputs.exists == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - if: steps.scaffold.outputs.exists == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: packages/web/pnpm-lock.yaml
      - if: steps.scaffold.outputs.exists == 'true'
        working-directory: packages/web
        run: pnpm install --frozen-lockfile
      - if: steps.scaffold.outputs.exists == 'true'
        working-directory: packages/web
        run: pnpm lint && pnpm typecheck && pnpm test
